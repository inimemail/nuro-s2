name: CI

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable source commit selected by the release workflow
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.1-alpine3.23
        env:
          POSTGRES_USER: nuro_verify
          POSTGRES_PASSWORD: isolated-ci-fixture
          POSTGRES_DB: nuro_upgrade_verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nuro_verify -d nuro_upgrade_verify"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NURO_CACHE_TEST_DSN: host=127.0.0.1 port=5432 user=nuro_verify password=isolated-ci-fixture dbname=nuro_upgrade_verify sslmode=disable
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          expected="$(awk '$1 == "go" { print $2; exit }' backend/go.mod)"
          test "$(go env GOVERSION)" = "go${expected}"
      - name: Protected upgrade contracts
        run: |
          python3 tools/check_upgrade_contracts.py
          python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - uses: dtolnay/rust-toolchain@1.90.0
      - name: Build isolated transport fixture
        run: cargo build --manifest-path edge-rs/Cargo.toml --release --locked
      - name: Integration tests
        working-directory: backend
        env:
          NURO_EDGE_TEST_BINARY: ${{ github.workspace }}/edge-rs/target/release/sub2api-edge-rs
        run: |
          set -euo pipefail
          docker info >/dev/null
          go test -json -tags=integration ./... | tee /tmp/integration-tests.jsonl
          python3 ../tools/check_go_test_results.py /tmp/integration-tests.jsonl --require-test TestGeminiCachePostgresTransactions --require-test TestScopedAdminPostgresTransactions --require-test TestUpgradeV0219MigrationContracts --require-test TestConcurrencyCacheSuite/TestGetAccountsLoadBatch --require-test TestEdgeStreamRealRustTransportRecovery --require-test TestEdgeWSRealRustHealthSettlement --require-test TestEdgeWSRealRustFailedTurnReportsBeforeClientClose
      - name: Deployment credential checks
        run: bash tools/test_deploy_admin_bootstrap.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.13.0'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Complete frontend validation
        run: make test-frontend-full

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - name: Rust validation
        run: make test-rust
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
      - name: Real Go and Rust transport recovery
        working-directory: backend
        env:
          NURO_EDGE_TEST_BINARY: ${{ github.workspace }}/edge-rs/target/release/sub2api-edge-rs
        run: |
          set -euo pipefail
          cargo build --manifest-path ../edge-rs/Cargo.toml --release --locked
          go test -json ./internal/handler -run '^TestEdge(StreamRealRustTransportRecovery|WSRealRustHealthSettlement|WSRealRustFailedTurnReportsBeforeClientClose)$' | tee /tmp/edge-tests.jsonl
          python3 ../tools/check_go_test_results.py /tmp/edge-tests.jsonl --require-test TestEdgeStreamRealRustTransportRecovery --require-test TestEdgeWSRealRustHealthSettlement --require-test TestEdgeWSRealRustFailedTurnReportsBeforeClientClose

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          expected="$(awk '$1 == "go" { print $2; exit }' backend/go.mod)"
          test "$(go env GOVERSION)" = "go${expected}"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=30m
          working-directory: backend
