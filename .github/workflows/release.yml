name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.0)'
        required: true
        type: string
      simple_release:
        description: 'Simple release: only x86_64 GHCR image, skip other artifacts'
        required: false
        type: boolean
        default: false

# 环境变量：合并 workflow_dispatch 输入和 repository variable
# tag push 触发时读取 vars.SIMPLE_RELEASE，workflow_dispatch 时使用输入参数
env:
  SIMPLE_RELEASE: ${{ github.event.inputs.simple_release == 'true' || vars.SIMPLE_RELEASE == 'true' }}

permissions:
  contents: write
  packages: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve immutable release identity
        id: identity
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG_NAME="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          SHA=$(python3 tools/release_artifacts.py resolve --tag "$TAG_NAME")
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\ntag=%s\n' "$SHA" "$TAG_NAME" >> "$GITHUB_OUTPUT"

  # Every required check validates the same commit that is packaged below.
  validate:
    needs: [resolve]
    uses: ./.github/workflows/backend-ci.yml
    with:
      source_sha: ${{ needs.resolve.outputs.sha }}

  validate-security:
    needs: [resolve]
    uses: ./.github/workflows/security-scan.yml
    with:
      source_sha: ${{ needs.resolve.outputs.sha }}

  # Update VERSION file with tag version
  update-version:
    needs: [resolve, validate, validate-security]
    env:
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Update VERSION file
        run: |
          VERSION=${RELEASE_TAG#v}
          echo "$VERSION" > backend/cmd/server/VERSION
          echo "Updated VERSION file to: $VERSION"

      - name: Bind version artifact
        run: |
          mkdir -p /tmp/release-version
          cp backend/cmd/server/VERSION /tmp/release-version/VERSION
          python3 tools/release_artifacts.py write --artifact /tmp/release-version --manifest /tmp/version-manifest.json --sha "$RELEASE_SHA" --tag "$RELEASE_TAG"

      - name: Upload version manifest
        uses: actions/upload-artifact@v7
        with:
          name: version-manifest
          path: /tmp/version-manifest.json
          retention-days: 1

      - name: Upload VERSION artifact
        uses: actions/upload-artifact@v7
        with:
          name: version-file
          path: backend/cmd/server/VERSION
          retention-days: 1

  build-frontend:
    needs: [resolve, validate, validate-security]
    env:
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.13.0'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build frontend
        run: pnpm run build
        working-directory: frontend

      - name: Bind frontend artifact
        run: |
          python3 tools/release_artifacts.py write --artifact backend/internal/web/dist --manifest /tmp/frontend-manifest.json \
            --sha "$RELEASE_SHA" --tag "$RELEASE_TAG" --toolchain "node=$(node --version)" --toolchain "pnpm=$(pnpm --version)"

      - name: Upload frontend manifest
        uses: actions/upload-artifact@v7
        with:
          name: frontend-manifest
          path: /tmp/frontend-manifest.json
          retention-days: 1

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: backend/internal/web/dist/
          retention-days: 1

  release:
    needs: [resolve, update-version, build-frontend]
    env:
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      GOFLAGS: -mod=readonly
      GORELEASER_CURRENT_TAG: ${{ needs.resolve.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Download VERSION artifact
        uses: actions/download-artifact@v8
        with:
          name: version-file
          path: backend/cmd/server/

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: backend/internal/web/dist/

      - name: Download artifact manifests
        uses: actions/download-artifact@v8
        with:
          pattern: '*-manifest'
          merge-multiple: true
          path: /tmp/release-manifests

      - name: Verify artifact identities and tag
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")" = "$RELEASE_SHA"
          mkdir -p /tmp/release-version
          cp backend/cmd/server/VERSION /tmp/release-version/VERSION
          python3 tools/release_artifacts.py verify --artifact /tmp/release-version --manifest /tmp/release-manifests/version-manifest.json --sha "$RELEASE_SHA" --tag "$RELEASE_TAG"
          python3 tools/release_artifacts.py verify --artifact backend/internal/web/dist --manifest /tmp/release-manifests/frontend-manifest.json \
            --sha "$RELEASE_SHA" --tag "$RELEASE_TAG" --toolchain 'node=v24.13.0' --toolchain 'pnpm=9.15.9'
          test "$(tr -d '\r\n' < backend/cmd/server/VERSION)" = "${RELEASE_TAG#v}"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum

      - name: Verify Go version
        run: |
          expected="$(awk '$1 == "go" { print $2; exit }' backend/go.mod)"
          test "$(go env GOVERSION)" = "go${expected}"

      # Docker setup for GoReleaser
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      - name: Install cross
        run: cargo install cross --version 0.2.5 --locked

      - name: Login to DockerHub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get tag message safely
        id: tag_message
        run: |
          set -euo pipefail
          DELIMITER="message_$(openssl rand -hex 16)"
          printf 'message<<%s\n' "$DELIMITER" >> "$GITHUB_OUTPUT"
          git tag -l --format='%(contents:body)' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf '\n%s\n' "$DELIMITER" >> "$GITHUB_OUTPUT"

      - name: Set lowercase owner for GHCR
        id: lowercase
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build edge-rs release archives
        run: |
          set -euo pipefail
          TAG_NAME="$RELEASE_TAG"
          VERSION=${RELEASE_TAG#v}

          mkdir -p /tmp/release-edge .release-edge/amd64
          cross build --locked --manifest-path edge-rs/Cargo.toml --release --target x86_64-unknown-linux-musl
          cp edge-rs/target/x86_64-unknown-linux-musl/release/sub2api-edge-rs /tmp/release-edge/sub2api-edge-rs
          cp /tmp/release-edge/sub2api-edge-rs .release-edge/amd64/sub2api-edge-rs
          tar -C /tmp/release-edge -czf /tmp/release-edge/sub2api-edge-rs_${VERSION}_linux_amd64.tar.gz sub2api-edge-rs
          rm -f /tmp/release-edge/sub2api-edge-rs

          if [ "$SIMPLE_RELEASE" != 'true' ]; then
            mkdir -p .release-edge/arm64
            cross build --locked --manifest-path edge-rs/Cargo.toml --release --target aarch64-unknown-linux-musl
            cp edge-rs/target/aarch64-unknown-linux-musl/release/sub2api-edge-rs /tmp/release-edge/sub2api-edge-rs
            cp /tmp/release-edge/sub2api-edge-rs .release-edge/arm64/sub2api-edge-rs
            tar -C /tmp/release-edge -czf /tmp/release-edge/sub2api-edge-rs_${VERSION}_linux_arm64.tar.gz sub2api-edge-rs
            rm -f /tmp/release-edge/sub2api-edge-rs
          fi

          cd /tmp/release-edge
          sha256sum sub2api-edge-rs_${VERSION}_linux_*.tar.gz > edge-rs-checksums.txt

      - name: Verify locks before publishing
        run: git diff --exit-code -- backend/go.mod backend/go.sum frontend/package.json frontend/pnpm-lock.yaml edge-rs/Cargo.lock

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: 'v2.14.0'
          args: release --clean --skip=validate ${{ env.SIMPLE_RELEASE == 'true' && '--config=.goreleaser.simple.yaml' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_MESSAGE: ${{ steps.tag_message.outputs.message }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_OWNER_LOWER: ${{ steps.lowercase.outputs.owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || 'skip' }}

      - name: Collect prebuilt Edge archives
        run: |
          mkdir -p dist/edge-rs
          cp /tmp/release-edge/* dist/edge-rs/

      - name: Check dependency locks remained read-only
        run: git diff --exit-code -- backend/go.mod backend/go.sum frontend/package.json frontend/pnpm-lock.yaml edge-rs/Cargo.lock

      - name: Record complete release provenance
        run: |
          set -euo pipefail
          OWNER_LOWER=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          IMAGE_DIGEST=$(docker buildx imagetools inspect "ghcr.io/${OWNER_LOWER}/sub2api:${RELEASE_TAG#v}" --format '{{.Manifest.Digest}}')
          RUST_VERSION=$(rustc --version)
          python3 tools/release_artifacts.py inventory --artifact dist --manifest /tmp/release-manifest.json \
            --sha "$RELEASE_SHA" --tag "$RELEASE_TAG" --image-digest "$IMAGE_DIGEST" \
            --component-manifest /tmp/release-manifests/frontend-manifest.json \
            --component-manifest /tmp/release-manifests/version-manifest.json \
            --toolchain "go=$(go env GOVERSION)" --toolchain "rust=$RUST_VERSION"

      - name: Upload release provenance evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-provenance
          path: /tmp/release-manifest.json

      - name: Attach release provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" /tmp/release-manifest.json --clobber

      - name: Upload edge-rs release archives
        if: ${{ env.SIMPLE_RELEASE != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="$RELEASE_TAG"
          VERSION=${RELEASE_TAG#v}
          gh release upload "$TAG_NAME" dist/edge-rs/sub2api-edge-rs_*.tar.gz dist/edge-rs/edge-rs-checksums.txt --clobber

      # Update DockerHub description
      - name: Update DockerHub description
        if: ${{ env.SIMPLE_RELEASE != 'true' && env.DOCKERHUB_USERNAME != '' }}
        uses: peter-evans/dockerhub-description@v5
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/sub2api
          short-description: "Sub2API - AI API Gateway Platform"
          readme-filepath: ./deploy/DOCKER.md

      # Send Telegram notification
      - name: Send Telegram Notification
        if: ${{ env.SIMPLE_RELEASE != 'true' }}
        env:
          TAG_MESSAGE: ${{ steps.tag_message.outputs.message }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        continue-on-error: true
        run: |
          # 检查必要的环境变量
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram credentials not configured, skipping notification"
            exit 0
          fi

          TAG_NAME="$RELEASE_TAG"
          VERSION=${RELEASE_TAG#v}
          VERSION=${TAG_NAME#v}
          REPO="${{ github.repository }}"
          GHCR_IMAGE="ghcr.io/${REPO,,}"  # ${,,} converts to lowercase

          # 获取 tag message 内容并转义 Markdown 特殊字符
          TAG_MESSAGE=$(echo "$TAG_MESSAGE" | sed 's/\([_*`\[]\)/\\\1/g')

          # 限制消息长度（Telegram 消息限制 4096 字符，预留空间给头尾固定内容）
          if [ ${#TAG_MESSAGE} -gt 3500 ]; then
            TAG_MESSAGE="${TAG_MESSAGE:0:3500}..."
          fi

          # 构建消息内容
          MESSAGE="🚀 *Sub2API 新版本发布！*"$'\n'$'\n'
          MESSAGE+="📦 版本号: \`${VERSION}\`"$'\n'$'\n'

          # 添加更新内容
          if [ -n "$TAG_MESSAGE" ]; then
            MESSAGE+="${TAG_MESSAGE}"$'\n'$'\n'
          fi

          MESSAGE+="🐳 *Docker 部署:*"$'\n'
          MESSAGE+="\`\`\`bash"$'\n'
          # 根据是否配置 DockerHub 动态生成
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            DOCKER_IMAGE="${DOCKERHUB_USERNAME}/sub2api"
            MESSAGE+="# Docker Hub"$'\n'
            MESSAGE+="docker pull ${DOCKER_IMAGE}:${VERSION}"$'\n'
            MESSAGE+="# GitHub Container Registry"$'\n'
          fi
          MESSAGE+="docker pull ${GHCR_IMAGE}:${VERSION}"$'\n'
          MESSAGE+="\`\`\`"$'\n'$'\n'
          MESSAGE+="🔗 *相关链接:*"$'\n'
          MESSAGE+="• [GitHub Release](https://github.com/${REPO}/releases/tag/${TAG_NAME})"$'\n'
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            MESSAGE+="• [Docker Hub](https://hub.docker.com/r/${DOCKER_IMAGE})"$'\n'
          fi
          MESSAGE+="• [GitHub Packages](https://github.com/${REPO}/pkgs/container/sub2api)"$'\n'$'\n'
          MESSAGE+="#Sub2API #Release #${TAG_NAME//./_}"

          # 发送消息
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg chat_id "${TELEGRAM_CHAT_ID}" \
              --arg text "${MESSAGE}" \
              '{
                chat_id: $chat_id,
                text: $text,
                parse_mode: "Markdown",
                disable_web_page_preview: true
              }')"
